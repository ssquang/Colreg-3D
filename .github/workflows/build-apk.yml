name: Build Android APK (COLREGS-3D)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets for Mobile
        run: |
          mkdir -p www
          cp simulator.html www/index.html
          cp simulator.html www/simulator.html
          cp manifest.json www/
          cp sw.js www/ || true
          [ -f colreg-72-viet-ver.pdf ] && cp colreg-72-viet-ver.pdf www/ || true
          [ -f colreg-72-eng-ver.pdf ] && cp colreg-72-eng-ver.pdf www/ || true
          cp -r js www/
          cp -r icons www/

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "COLREGS 3D" "com.marine.colregs3d" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Configure Screen Orientation & Permissions
        run: |
          # Cho phép xoay ngang thuận tiện lái tàu trên điện thoại
          sed -i 's/android:screenOrientation="unspecified"/android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COLREGS-3D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

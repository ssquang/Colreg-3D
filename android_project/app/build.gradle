plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marine.colregs3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.marine.colregs3d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // No external heavy dependencies needed for native WebView
}
